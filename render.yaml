# Render Blueprint: sitio estático (gratis). Render → New → Blueprint → elegir este repo.
services:
  - type: web
    name: gymtracker-pro
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/GymTrackerPro/browser
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    # SPA: cualquier ruta (/panel, /atletas/:id, /manual...) la resuelve Angular
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # PWA: el service worker, su índice y el HTML siempre se revalidan para que las versiones nuevas lleguen
      - path: /ngsw-worker.js
        name: Cache-Control
        value: no-cache
      - path: /ngsw.json
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
