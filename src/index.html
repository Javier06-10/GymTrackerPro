<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Coach Fénix — Software para entrenadores personales</title>
  <meta name="description" content="Coach Fénix: medidas, rutinas, asistencia, nutrición y cobros de tus atletas en un solo lugar. Software para entrenadores personales.">
  <link rel="canonical" href="https://coachfenix.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Coach Fénix">
  <meta property="og:title" content="Coach Fénix — Software para entrenadores personales">
  <meta property="og:description" content="Medidas, rutinas, asistencia, nutrición y cobros de tus atletas en un solo lugar. 14 días gratis.">
  <meta property="og:url" content="https://coachfenix.com/">
  <meta property="og:image" content="https://coachfenix.com/icons/icon-512x512.png">
  <meta property="og:locale" content="es_DO">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#2f3858">
  <!-- Declara soporte claro/oscuro: evita que Chrome Android "oscurezca" la app por su cuenta y altere los colores -->
  <meta name="color-scheme" content="light dark">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="icons/icono.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone / iPad: app a pantalla completa desde "Agregar a inicio" -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coach Fénix">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>
    // El aviso de "instalar app" puede llegar antes de que arranque Angular: se guarda para PwaService.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__pwaPrompt = e; });
    // Tema guardado en este dispositivo: se aplica antes de pintar para que no parpadee el color
    try { document.documentElement.dataset.tema = localStorage.getItem('gt-tema') || 'marca'; } catch (e) { document.documentElement.dataset.tema = 'marca'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <noscript>Activa JavaScript para usar Coach Fénix.</noscript>
</body>
</html>
